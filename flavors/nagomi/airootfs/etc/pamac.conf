# ==============================================================================
# KAZE NAGOMI: PAMAC GUI PACKAGE MANAGER CONFIGURATION (/etc/pamac.conf)
# ==============================================================================

### Pacman options
RemoveUnrequiredDeps
RefreshPeriod = 6
MaxParallelDownloads = 5
KeepNumPackages = 2

### AUR options
EnableAUR
CheckAURUpdates
CheckAURVCSUpdates
DownloadUpdates

### Flatpak / Appstream
EnableFlatpak
CheckFlatpakUpdates
