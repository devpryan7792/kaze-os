# ==============================================================================
# KAZE NAGOMI: CALAMARES MASTER SETTINGS (flavors/nagomi/calamares/settings.conf)
# Includes Desktop Selection (Plasma 6 vs GNOME)
# ==============================================================================

---
modules-search: [ local ]

instances:
  - id:       snapper-setup
    module:   shellprocess
    config:   shellprocess-snapper.conf
  - id:       cleanup
    module:   shellprocess
    config:   shellprocess-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - netinstall
      - users
      - networkmanager
      - bootloader
      - services-systemd
      - shellprocess@snapper-setup
      - shellprocess@cleanup
      - umount
  - show:
      - finished

branding: kaze-nagomi
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
