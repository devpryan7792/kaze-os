# ==============================================================================
# KAZE KASUMI: KITTY TERMINAL CONFIGURATION
# ==============================================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

background_opacity 0.92
dynamic_background_opacity yes
confirm_os_window_close 0

# TokyoNight / Kaze Neon Color Scheme
foreground #c0caf5
background #1a1b26

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26
cursor_shape beam
cursor_blink_interval 0.5

# Window Border
window_padding_width 10
active_border_color #7aa2f7
inactive_border_color #414868

# Color palette
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
