# ==============================================================================
# KAZE KASUMI: HYPRLOCK CONFIGURATION (hypr/hyprlock.conf)
# Hardware-accelerated lockscreen with dynamic blur and Material You styling
# ==============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 255, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 210, 240, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.8)
    inner_color = rgba(22, 22, 30, 0.6)
    font_color = rgb(240, 240, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Enter password...</span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
