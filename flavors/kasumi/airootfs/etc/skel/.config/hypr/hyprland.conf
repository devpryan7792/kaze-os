# ==============================================================================
# KAZE KASUMI: HYPRLAND CONFIGURATION (hypr/hyprland.conf)
# Dynamic Material You Theme + Fluid Animations + Ergonomic Binds
# ==============================================================================

# Monitor setup
monitor=,preferred,auto,1

# Autostart Daemons (Robust with Tier 1 Fallbacks)
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = which waybar >/dev/null && waybar
exec-once = which hyprpaper >/dev/null && hyprpaper
exec-once = which awww-daemon >/dev/null && awww-daemon
exec-once = which quickshell >/dev/null && quickshell
exec-once = hypridle
exec-once = which kaze-cli >/dev/null && kaze-cli wallpaper random
exec-once = which cliphist >/dev/null && wl-paste --type text --watch cliphist store
exec-once = which cliphist >/dev/null && wl-paste --type image --watch cliphist store

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Virtual Machine & Hardware Cursor Handling
cursor {
    no_hardware_cursors = true
}

# Input Configuration
input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        scroll_factor = 1.0
    }
    sensitivity = 0
}

# General Layout & Styling
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    allow_tearing = false
}

# Window Decorations & Blur
decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

# Fluid Animation Curves
animations {
    enabled = true
    bezier = fluid, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, linear, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, fluid, slide
}

# Dwindle Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Window Rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(kaze-welcome)$
windowrulev2 = float, class:^(calamares)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = dimaround, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = opacity 0.94 0.88, class:^(ghostty)$
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$
windowrulev2 = idleinhibit fullscreen, class:^(.*)$

# Layer Rules for QuickShell
layerrule = blur, quickshell:.*
layerrule = ignorezero, quickshell:.*
layerrule = blur, notifications
layerrule = ignorezero, notifications

# Super Modifier
$mainMod = SUPER

# Application Launchers (Guaranteed with Tier 1 Fallbacks)
bind = $mainMod, Return, exec, which ghostty >/dev/null && ghostty || kitty
bind = $mainMod, Space, exec, which quickshell >/dev/null && quickshell ipc call launcher toggle || fuzzel
bind = $mainMod, d, exec, which quickshell >/dev/null && quickshell ipc call dashboard toggle || fuzzel
bind = $mainMod, w, exec, which quickshell >/dev/null && quickshell ipc call wallpaperPicker toggle || fuzzel
bind = $mainMod, e, exec, which ghostty >/dev/null && ghostty -e yazi || kitty -e yazi
bind = $mainMod SHIFT, w, exec, which kaze-cli >/dev/null && kaze-cli wallpaper random

# Window Actions
bind = $mainMod, q, killactive,
bind = $mainMod SHIFT, q, exit,
bind = $mainMod, v, togglefloating,
bind = $mainMod, f, fullscreen, 0
bind = $mainMod SHIFT, f, fullscreen, 1
bind = $mainMod, p, pseudo,
bind = $mainMod, t, togglesplit,

# Focus Navigation
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window Movement
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Workspaces (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scratchpad Special Workspace
bind = $mainMod, s, togglespecialworkspace, magic
bind = $mainMod SHIFT, s, movetoworkspace, special:magic

# Screenshot & Snipping
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send 'Kaze OS' 'Selection copied to clipboard'
bind = SHIFT, Print, exec, grim ~/Pictures/$(date +'%Y-%m-%d_%H%M%S.png') && notify-send 'Kaze OS' 'Full screenshot saved to Pictures'

# Hardware Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
