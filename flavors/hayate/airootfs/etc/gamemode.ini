# ==============================================================================
# KAZE HAYATE: FERAL GAMEMODE CONFIGURATION (/etc/gamemode.ini)
# ==============================================================================

[general]
desiredgov=performance
igpu_desiredgov=performance
defaultrecursion=0
inhibit_screensaver=1

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high

[cpu]
park_cores=no
pin_cores=yes

[custom]
# Notification hook on game launch
start=notify-send -a GameMode "GameMode Active" "Optimized CPU and GPU clock frequencies."
end=notify-send -a GameMode "GameMode Inactive" "Restored balanced clock frequencies."
