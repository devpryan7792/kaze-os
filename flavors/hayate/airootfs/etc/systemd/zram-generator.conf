# ==============================================================================
# KAZE HAYATE: ZRAM GENERATOR CONFIGURATION (/etc/systemd/zram-generator.conf)
# Dynamic in-RAM zstd compressed swap pool with zero disk swap penalty
# ==============================================================================

[zram0]
zram-size = min(ram, 32768)
compression-algorithm = zstd
swap-priority = 32767
fs-type = swap
