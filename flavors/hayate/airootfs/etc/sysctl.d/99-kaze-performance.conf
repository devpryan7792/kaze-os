# ==============================================================================
# KAZE HAYATE: LOW-LATENCY KERNEL SYSCTL TUNING (/etc/sysctl.d/99-kaze-performance.conf)
# Eliminates frame-time jitter, reduces swap overhead, and optimizes scheduler
# ==============================================================================

# Reduce aggressive disk swapping
vm.swappiness = 10

# Maintain cached dentries and inodes longer
vm.vfs_cache_pressure = 50

# Prevent background writeback bursts from stalling interactive tasks
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# Maximum file handles
fs.file-max = 2097152

# Low-latency CFS bandwidth slice for interactive task preemption
kernel.sched_cfs_bandwidth_slice_us = 3000

# High-throughput network stack with BBR congestion control
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# Increase memory map count for modern memory-hungry games & Wine/Proton
vm.max_map_count = 2147483642
