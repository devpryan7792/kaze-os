<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kazeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#ff757f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#16161e" stroke="url(#kazeGrad)" stroke-width="12" />
  <!-- Wind / Gale Stylized Swirl (風) -->
  <g filter="url(#glow)">
    <path d="M 120 220 C 160 140, 320 120, 380 180 C 440 240, 340 320, 240 300 C 160 280, 160 380, 240 390 C 300 400, 360 360, 380 340" 
          fill="none" stroke="url(#kazeGrad)" stroke-width="26" stroke-linecap="round" />
    <!-- Secondary Dynamic Stream -->
    <path d="M 160 180 C 220 140, 310 150, 350 200 C 380 240, 320 270, 260 260" 
          fill="none" stroke="#7dcfff" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <!-- Center Kanji Accent 風 -->
    <text x="256" y="275" font-family="'Noto Sans CJK JP', sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">風</text>
  </g>
</svg>
