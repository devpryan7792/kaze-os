#
# /etc/pacman.conf - Kaze OS Build & Live Configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = auto


# Output options
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 5

# Security & Signature Options
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

# ==============================================================================
# KAZE OS CUSTOM REPOSITORIES
# ==============================================================================

# Local development repository (checked if packages built locally)
[kaze-local]
SigLevel = Optional TrustAll
Server = file://@REPO_DIR@/$arch

# Upstream Kaze release repository (GitHub Pages CDN - enable once deployed)
#[kaze]
#SigLevel = Optional TrustAll
#Server = https://kaze-os.github.io/repo/$arch

# ==============================================================================
# OFFICIAL ARCH LINUX REPOSITORIES (Prioritized for base stability & fast CDN)
# ==============================================================================

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ==============================================================================
# CACHYOS REPOSITORIES (BORE Kernel, Calamares & x86-64-v3 packages via CDN77)
# ==============================================================================

[cachyos-v3]
SigLevel = Never
Server = https://cdn77.cachyos.org/repo/x86_64_v3/$repo

[cachyos]
SigLevel = Never
Server = https://cdn77.cachyos.org/repo/$arch/$repo
