# ==============================================================================
# KAZE OS: SNAPPER & BTRFS RECOVERY INITIALIZATION
# (core/calamares/modules/shellprocess-snapper.conf)
# ==============================================================================

---
dontChroot: false
timeout: 120
script:
  - "-/usr/bin/bash -c 'if [ \"$(findmnt -n -o FSTYPE /)\" = \"btrfs\" ]; then \
        echo \"==> Initializing Kaze OS Snapper configuration on / ...\"; \
        umount /.snapshots 2>/dev/null || true; \
        rm -rf /.snapshots; \
        snapper --no-dbus -c root create-config /; \
        btrfs subvolume delete /.snapshots 2>/dev/null || rm -rf /.snapshots; \
        mkdir -p /.snapshots; \
        mount -a; \
        chmod 750 /.snapshots; \
        sed -i \"s/ALLOW_GROUPS=\\\"\\\"/ALLOW_GROUPS=\\\"wheel\\\"/\" /etc/snapper/configs/root; \
        sed -i \"s/TIMELINE_LIMIT_HOURLY=\\\"10\\\"/TIMELINE_LIMIT_HOURLY=\\\"5\\\"/\" /etc/snapper/configs/root; \
        sed -i \"s/TIMELINE_LIMIT_DAILY=\\\"10\\\"/TIMELINE_LIMIT_DAILY=\\\"7\\\"/\" /etc/snapper/configs/root; \
        sed -i \"s/TIMELINE_LIMIT_WEEKLY=\\\"0\\\"/TIMELINE_LIMIT_WEEKLY=\\\"2\\\"/\" /etc/snapper/configs/root; \
        sed -i \"s/TIMELINE_LIMIT_MONTHLY=\\\"10\\\"/TIMELINE_LIMIT_MONTHLY=\\\"0\\\"/\" /etc/snapper/configs/root; \
        sed -i \"s/TIMELINE_LIMIT_YEARLY=\\\"10\\\"/TIMELINE_LIMIT_YEARLY=\\\"0\\\"/\" /etc/snapper/configs/root; \
        echo \"==> Regenerating GRUB menu with Btrfs snapshot support...\"; \
        grub-mkconfig -o /boot/grub/grub.cfg; \
     fi'"
