# ==============================================================================
# KAZE OS: TARGET SYSTEM CLEANUP
# (core/calamares/modules/shellprocess-cleanup.conf)
# ==============================================================================

---
dontChroot: false
timeout: 60
script:
  - "-/usr/bin/bash -c 'rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/multi-user.target.wants/pacman-init.service 2>/dev/null || true'"
  - "-/usr/bin/bash -c 'rm -rf /etc/systemd/system/getty@tty1.service.d 2>/dev/null || true'"
  - "-/usr/bin/bash -c 'rm -f /root/.automated_script.sh 2>/dev/null || true'"
