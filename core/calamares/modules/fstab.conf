# ==============================================================================
# KAZE OS: CALAMARES FSTAB GENERATOR (core/calamares/modules/fstab.conf)
# ==============================================================================

---
mountOptions:
  default: defaults,noatime
  btrfs: defaults,noatime,compress=zstd:3,space_cache=v2
  ext4: defaults,noatime
  vfat: defaults,umask=0077

ssdExtraMountOptions:
  btrfs: discard=async
  ext4: discard
