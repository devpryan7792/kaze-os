# ==============================================================================
# KAZE OS: CALAMARES USERS MODULE (core/calamares/modules/users.conf)
# ==============================================================================

---
defaultGroups:
  - name: "wheel"
    must_exist: true
  - name: "video"
  - name: "audio"
  - name: "storage"
  - name: "optical"
  - name: "network"
  - name: "input"

autologinGroup: "autologin"
sudoersGroup: "wheel"
setRootPassword: true
doAutologin: false
sudoersFile: "/etc/sudoers.d/00_wheel_sudo"
avatarPutInHome: false
writeEtcDefaultUsers: false
allowWeakPasswords: false
userShell: "/bin/bash"
