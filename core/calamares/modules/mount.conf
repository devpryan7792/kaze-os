# ==============================================================================
# KAZE OS: CALAMARES BTRFS MOUNT TOPOLOGY (core/calamares/modules/mount.conf)
# 5-Subvolume Architecture for Resilient, Isolated Rollback Protection
# ==============================================================================

---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Automated 5-Subvolume Btrfs Mapping
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /var/cache
    subvolume: /@var_cache

# Optimized Mount Flags for High-Performance Flash Storage
btrfsMountOptions:
  - filesystem: default
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
  - subvolume: /@
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
  - subvolume: /@home
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
  - subvolume: /@snapshots
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
  - subvolume: /@var_log
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
  - subvolume: /@var_cache
    options: [ noatime, compress=zstd:3, space_cache=v2 ]
