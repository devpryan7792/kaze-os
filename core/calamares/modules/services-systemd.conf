# ==============================================================================
# KAZE OS: CALAMARES SYSTEMD SERVICES (core/calamares/modules/services-systemd.conf)
# ==============================================================================

---
units:
  # Networking & Connectivity
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false
  - name: "systemd-timesyncd.service"
    action: "enable"
    mandatory: false

  # Printing & Network Discovery
  - name: "cups.service"
    action: "enable"
    mandatory: false
  - name: "avahi-daemon.service"
    action: "enable"
    mandatory: false

  # Storage & Snapshot Services
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false
  - name: "grub-btrfsd.service"
    action: "enable"
    mandatory: false
  - name: "snapper-timeline.timer"
    action: "enable"
    mandatory: false
  - name: "snapper-cleanup.timer"
    action: "enable"
    mandatory: false
